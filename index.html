<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Indie Game</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #e8edec; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .overlay { position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; }
      .screen { background: rgba(8, 14, 20, 0.62); }
      #rotate { background: #0b1020; z-index: 50; font-size: 22px; display: none; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 0 #122027; }
      .title[data-state="extracted"] { color: #8fe08a; } .title[data-state="dead"] { color: #ff8a7a; } .title[data-state="lost"] { color: #f2c14e; }
      .sub { font-size: 14px; opacity: .8; }
      .stash { font-size: 17px; color: #6fe0d0; }
      .btn { font: inherit; font-size: 20px; font-weight: 700; padding: 12px 34px; border-radius: 10px; border: 2px solid #8fe08a; background: #273e2b; color: #e8edec; cursor: pointer; }
      .btn:active { background: #395330; }
      .hud { position: fixed; inset: 0; pointer-events: none !important; display: none; text-shadow: 0 1px 2px #122027, 0 0 3px #122027; }
      .hud > * { pointer-events: none; }
      .hp { position: absolute; left: calc(14px + env(safe-area-inset-left)); top: 12px; display: flex; gap: 4px; }
      .pip { width: 16px; height: 16px; background: #e0524a; border: 2px solid #122027; border-radius: 3px; box-sizing: border-box; }
      .pip.off { background: #263c47; }
      .timer { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 700 22px/1 ui-monospace, monospace; background: rgba(18,32,39,.55); padding: 4px 10px; border-radius: 6px; }
      .timer.low { color: #ff6a5c; }
      .samples { position: absolute; right: calc(14px + env(safe-area-inset-right)); top: 10px; font: 700 18px/1 system-ui, sans-serif; color: #6fe0d0; background: rgba(18,32,39,.55); padding: 5px 10px; border-radius: 6px; }
      .gem { display: inline-block; width: 9px; height: 9px; background: #6fe0d0; transform: rotate(45deg); margin-right: 4px; }
      .extract-bar { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); width: 180px; height: 14px; border: 2px solid #122027; background: rgba(18,32,39,.6); border-radius: 4px; display: none; overflow: hidden; }
      .extract-fill { height: 100%; width: 0; background: #8fe08a; }
      .extract-label { position: absolute; inset: 0; font: 700 10px/14px system-ui, sans-serif; text-align: center; }
      .arrow { position: fixed; display: none; color: #8fe08a; font-size: 26px; line-height: 1; pointer-events: none !important; text-shadow: 0 0 4px #122027, 0 0 2px #122027; }
      .hide-row { display: flex; gap: 22px; align-items: center; justify-content: center; padding: 0 16px; }
      .hide-left { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
      .hide-right { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 200px; max-width: 260px; }
      .btn.small { font-size: 16px; padding: 8px 22px; }
      .btn:disabled { opacity: .4; cursor: default; }
      .sel-info { min-height: 34px; }
      .result-list { display: flex; flex-direction: column; gap: 4px; min-width: 240px; max-height: 190px; overflow: auto; font-size: 15px; }
      .result-row { display: flex; align-items: center; gap: 8px; } .result-row span { flex: 1; text-align: left; } .result-row b { color: #f2e6a0; }
      .result-total { font-weight: 800; font-size: 18px; color: #6fe0d0; margin-top: 4px; }
      .result-lost { color: #ff8a7a; font-size: 14px; }
      .chip { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
      .chip[data-kind="quartz"] { background: #6fe0d0; } .chip[data-kind="ore"] { background: #c8e05a; } .chip[data-kind="bio"] { background: #c06090; }
      .toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none !important; z-index: 30; }
      .toast { background: rgba(18,32,39,.82); color: #e8edec; padding: 6px 14px; border-radius: 16px; font-size: 15px; font-weight: 700; border: 1px solid rgba(143,224,138,.5); }
      .bag-btn { position: fixed; right: calc(14px + env(safe-area-inset-right)); top: 42px; z-index: 20; min-width: 64px; height: 44px; font: 700 16px system-ui, sans-serif; color: #e8edec; background: rgba(39,62,43,.9); border: 2px solid #8fe08a; border-radius: 10px; display: none; }
      .bag-btn.on { background: #395330; }
      .bag-panel { position: fixed; right: calc(90px + env(safe-area-inset-right)); top: 42px; z-index: 20; padding: 8px 10px 10px; background: rgba(12,22,30,.93); border: 2px solid #3b4d56; border-radius: 10px; display: none; max-width: 62vw; }
      .bag-cols { display: flex; gap: 14px; align-items: flex-start; }
      .bag-col { display: flex; flex-direction: column; gap: 4px; }
      .bag-col.note { width: 110px; }
      .bag-lbl { font-size: 12px; font-weight: 700; color: #a3cfe3; line-height: 1.25; min-height: 15px; text-align: left; }
      .bag-stats { font-size: 13px; font-weight: 700; color: #f2e6a0; margin-top: 4px; text-align: left; }
      .bag-act { font: 700 15px system-ui, sans-serif; height: 44px; color: #e8edec; background: #1b2e39; border: 2px solid #567886; border-radius: 8px; margin-top: 6px; }
      .bag-act:active { background: #263c47; }
      .bag-trash { height: 40px; line-height: 40px; text-align: center; font-weight: 700; font-size: 14px; color: #ff8a7a; border: 2px dashed #a8504a; border-radius: 8px; }
      .bag-trash.hot { background: rgba(224,82,74,.45); color: #fff; }
      .gv { position: relative; box-sizing: content-box; outline: 2px solid #3b4d56; background-color: #101c24; background-image: linear-gradient(#263c47 1px, transparent 1px), linear-gradient(90deg, #263c47 1px, transparent 1px); background-size: var(--cell) var(--cell); touch-action: none; }
      .gv-preview { position: absolute; display: none; pointer-events: none; box-sizing: border-box; border-radius: 4px; z-index: 5; }
      .gv-preview.ok { background: rgba(111,224,100,.4); border: 2px solid #8fe08a; } .gv-preview.bad { background: rgba(224,82,74,.4); border: 2px solid #ff8a7a; }
      .blk { position: absolute; box-sizing: border-box; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; font-size: 12px; font-weight: 800; line-height: 1.15; color: #10181c; touch-action: none; cursor: grab; z-index: 2; }
      .blk[data-kind="quartz"] { background: #6fe0d0; border: 2px solid #c9fff4; }
      .blk[data-kind="ore"] { background: #c8e05a; border: 2px solid #f0ffa8; }
      .blk[data-kind="bio"] { background: #c06090; border: 2px solid #e890b8; color: #fff0f6; }
      .blk .v { font-weight: 700; font-size: 13px; }
      .blk .bar { position: absolute; left: 3px; bottom: 2px; height: 3px; background: rgba(16,24,28,.55); border-radius: 2px; max-width: calc(100% - 6px); }
      .blk.sel { box-shadow: 0 0 0 2px #fff4c0; z-index: 3; }
      .blk.dragging { opacity: .35; }
      .blk.bad { animation: shake .3s; background-color: #e0524a !important; }
      .blk.ghost { position: fixed; opacity: .88; pointer-events: none; z-index: 100; }
      @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
      .tabs { display: flex; gap: 6px; }
      .tab { font: 700 15px system-ui, sans-serif; color: #e8edec; background: #1b2e39; border: 2px solid #567886; border-radius: 8px; padding: 8px 18px; min-height: 40px; }
      .tab.on { background: #273e2b; border-color: #8fe08a; }
      .stash-pane { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
      .research-pane { display: none; flex-direction: column; gap: 8px; width: calc(100vw - 310px); max-width: 640px; max-height: calc(100vh - 28px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-right: 4px; text-align: left; }
      .fac { display: flex; gap: 8px; align-items: stretch; background: rgba(12,22,30,.88); border: 2px solid #3b4d56; border-radius: 10px; padding: 8px; }
      .fac.built { border-color: #4f7a52; }
      .fac-head { flex: 0 0 132px; display: flex; flex-direction: column; gap: 4px; }
      .fac-name { font-size: 17px; font-weight: 800; color: #f2e6a0; }
      .fac-blurb { font-size: 11px; opacity: .75; line-height: 1.3; }
      .fac-cost { font-size: 12px; color: #6fe0d0; font-weight: 700; line-height: 1.3; }
      .fac-state { font-size: 12px; font-weight: 700; color: #8fe08a; }
      .fac-nodes { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; }
      .node { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; background: #101c24; border: 2px solid #263c47; border-left: 5px solid var(--fc); border-radius: 8px; padding: 6px 8px; }
      .node.learned { background: #14261f; border-color: var(--fc); }
      .node-top { display: flex; align-items: center; gap: 6px; }
      .node-field { font-size: 11px; font-weight: 800; color: #10181c; background: var(--fc); border-radius: 4px; padding: 1px 5px; }
      .node-name { font-size: 15px; color: var(--fc); }
      .node-ok { margin-left: auto; font-size: 11px; font-weight: 800; color: #8fe08a; border: 1px solid #8fe08a; border-radius: 4px; padding: 0 4px; }
      .node-effect { font-size: 12px; line-height: 1.35; }
      .node-law { font: 700 12px/1.3 ui-monospace, monospace; color: #f2e6a0; }
      .node-limit { font-size: 11px; line-height: 1.35; color: #ff9f8f; }
      .btn.act { font-size: 13px; padding: 6px 10px; min-height: 36px; margin-top: auto; }
      .activity { position: absolute; left: calc(14px + env(safe-area-inset-left)); top: 34px; font: 700 13px/1 system-ui, sans-serif; color: #ffd9a0; background: rgba(18,32,39,.55); padding: 4px 8px; border-radius: 6px; display: none; }
      .sun-dial { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: rgba(18,32,39,.55); border-radius: 6px; padding: 3px 6px 0; display: block; line-height: 0; }
      .ore-arrow { color: #c8e05a; font-size: 22px; }
      #btn-dash { position: fixed; right: calc(52px + env(safe-area-inset-right)); bottom: calc(146px + env(safe-area-inset-bottom)); width: 68px; height: 68px; border-radius: 50%; display: none; align-items: center; justify-content: center; line-height: 68px; text-align: center; font-weight: 800; font-size: 16px; color: #e8f6ff; background: rgba(90, 160, 230, .45); border: 3px solid rgba(200, 230, 255, .8); box-sizing: border-box; touch-action: none; --cd: 0deg; }
      #btn-dash::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(rgba(12,22,30,.78) var(--cd), transparent 0); pointer-events: none; }
      #btn-dash.ready { box-shadow: 0 0 10px rgba(130,190,255,.8); }
      #btn-dash:active { background: rgba(90, 160, 230, .85); }
      #touch { position: fixed; inset: 0; touch-action: none; display: none; }
      #joy-base, #joy-knob { position: fixed; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      #joy-base { width: 96px; height: 96px; border: 2px solid rgba(232,237,236,.5); background: rgba(232,237,236,.12); }
      #joy-knob { width: 44px; height: 44px; background: rgba(232,237,236,.55); border: 2px solid rgba(232,237,236,.8); box-sizing: border-box; }
      #btn-fire { position: fixed; right: calc(28px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; display: none; align-items: center; justify-content: center; line-height: 104px; text-align: center; font-weight: 800; font-size: 20px; color: #fff4c0; background: rgba(224, 82, 74, .45); border: 3px solid rgba(255, 244, 192, .75); touch-action: none; }
      #btn-fire.down { background: rgba(224, 82, 74, .85); transform: scale(.94); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
