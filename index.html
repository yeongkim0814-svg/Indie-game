<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Indie Game</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #e8edec; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .overlay { position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; }
      .screen { background: rgba(8, 14, 20, 0.62); }
      #rotate { background: #0b1020; z-index: 50; font-size: 22px; display: none; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 0 #122027; }
      .title[data-state="extracted"] { color: #8fe08a; } .title[data-state="dead"] { color: #ff8a7a; } .title[data-state="lost"] { color: #f2c14e; }
      .sub { font-size: 14px; opacity: .8; }
      .stash { font-size: 17px; color: #6fe0d0; }
      .btn { font: inherit; font-size: 20px; font-weight: 700; padding: 12px 34px; border-radius: 10px; border: 2px solid #8fe08a; background: #273e2b; color: #e8edec; cursor: pointer; }
      .btn:active { background: #395330; }
      .hud { position: fixed; inset: 0; pointer-events: none !important; display: none; text-shadow: 0 1px 2px #122027, 0 0 3px #122027; }
      .hud > * { pointer-events: none; }
      .hp { position: absolute; left: calc(14px + env(safe-area-inset-left)); top: 12px; display: flex; gap: 4px; }
      .pip { width: 16px; height: 16px; background: #e0524a; border: 2px solid #122027; border-radius: 3px; box-sizing: border-box; }
      .pip.off { background: #263c47; }
      .timer { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 700 22px/1 ui-monospace, monospace; background: rgba(18,32,39,.55); padding: 4px 10px; border-radius: 6px; }
      .timer.low { color: #ff6a5c; }
      .samples { position: absolute; right: calc(14px + env(safe-area-inset-right)); top: 10px; font: 700 18px/1 system-ui, sans-serif; color: #6fe0d0; background: rgba(18,32,39,.55); padding: 5px 10px; border-radius: 6px; }
      .gem { display: inline-block; width: 9px; height: 9px; background: #6fe0d0; transform: rotate(45deg); margin-right: 4px; }
      .extract-bar { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); width: 180px; height: 14px; border: 2px solid #122027; background: rgba(18,32,39,.6); border-radius: 4px; display: none; overflow: hidden; }
      .extract-fill { height: 100%; width: 0; background: #8fe08a; }
      .extract-label { position: absolute; inset: 0; font: 700 10px/14px system-ui, sans-serif; text-align: center; }
      .arrow { position: fixed; display: none; color: #8fe08a; font-size: 26px; line-height: 1; pointer-events: none !important; text-shadow: 0 0 4px #122027, 0 0 2px #122027; }
      #touch { position: fixed; inset: 0; touch-action: none; display: none; }
      #joy-base, #joy-knob { position: fixed; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      #joy-base { width: 96px; height: 96px; border: 2px solid rgba(232,237,236,.5); background: rgba(232,237,236,.12); }
      #joy-knob { width: 44px; height: 44px; background: rgba(232,237,236,.55); border: 2px solid rgba(232,237,236,.8); box-sizing: border-box; }
      #btn-fire { position: fixed; right: calc(28px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; display: none; align-items: center; justify-content: center; line-height: 104px; text-align: center; font-weight: 800; font-size: 20px; color: #fff4c0; background: rgba(224, 82, 74, .45); border: 3px solid rgba(255, 244, 192, .75); touch-action: none; }
      #btn-fire.down { background: rgba(224, 82, 74, .85); transform: scale(.94); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
